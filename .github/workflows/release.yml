# ======================================================================
# GitHub Actions Workflow — Build Windows .exe & Create Release
# ======================================================================
# Triggers:
#   1. Push a tag v*  → builds the .exe, creates a GitHub Release,
#                        uploads the .exe as a release asset
#   2. Push to main   → just builds the .exe as a CI artifact (no release)
# ======================================================================

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller ^
            --onefile ^
            --name "pdf-splitter-to-png" ^
            --console ^
            --clean ^
            --noconfirm ^
            --add-data "src\pdf_splitter;pdf_splitter" ^
            --hidden-import "fitz" ^
            --hidden-import "fitz._pdf" ^
            --hidden-import "fitz.utils" ^
            --collect-all "fitz" ^
            --collect-all "pdf_splitter" ^
            src/pdf_splitter/__main__.py
        shell: cmd

      - name: Rename executable
        run: |
          ren "dist\pdf-splitter-to-png.exe" "pdf-splitter-to-png-windows-x64.exe"
        shell: cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-splitter-to-png-windows-x64
          path: dist/pdf-splitter-to-png-windows-x64.exe
          retention-days: 30

  # -------------------------------------------------------------------
  # RELEASE — only on tag pushes (v*)
  # -------------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if grep -q "## \[${VERSION}\]" CHANGELOG.md 2>/dev/null; then
            echo "notes_source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "notes_source=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: "v${{ steps.notes.outputs.version }}"
          body_path: ${{ steps.notes.outputs.notes_source == 'changelog' && 'CHANGELOG.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.notes_source != 'changelog' }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
