[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-splitter-to-png"
version = "1.0.0"
description = "PDF 批量拆图工具 — 按页拆分图片 PDF 为独立 PNG 图片"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "auowen807", email = ""},
]
keywords = ["pdf", "image", "png", "split", "ocr"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "PyMuPDF>=1.24.0,<1.26.0",
]

[project.urls]
"Repository" = "https://github.com/AuOwen807/pdf-splitter-to-png"
"Bug Tracker" = "https://github.com/AuOwen807/pdf-splitter-to-png/issues"

[project.scripts]
pdf-splitter = "pdf_splitter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdf_splitter" = ["py.typed"]
